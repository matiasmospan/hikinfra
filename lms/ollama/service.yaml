apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: hik
  labels:
    app: ollama
    component: slm-auditor
spec:
  type: ClusterIP   # Internal only — never exposed externally
  selector:
    app: ollama
  ports:
  - name: ollama-http
    port: 11434
    targetPort: 11434
    protocol: TCP
