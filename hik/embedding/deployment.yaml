# HIK v4 — Embedding Sidecar (Python/FastAPI) — Deployment
#
# Implements KMIR L2: cosine similarity classification against
# pre-computed EU AI Act violation centroids (all-MiniLM-L6-v2).
#
# The Go hik-sidecar calls this synchronously via HIK_EMBEDDING_ENDPOINT.
# Target latency: <15ms on CPU per classification.
# If this service is unreachable, the Go client degrades to L1-only mode
# gracefully (no crash, logged as warning).
#
# Image: build from hik-core/cmd/embedding-sidecar/
#   docker build -f hik-core/cmd/embedding-sidecar/Dockerfile \
#     -t gcr.io/matech-476914/hik-embedding-sidecar:latest \
#     hik-core/cmd/embedding-sidecar/
#
# NOTE: First startup downloads all-MiniLM-L6-v2 (~90MB) from HuggingFace.
# Use a PVC or bake the model into the image for production.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-sidecar
  namespace: hik
  labels:
    app: embedding-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-sidecar
  template:
    metadata:
      labels:
        app: embedding-sidecar
    spec:
      containers:
      - name: embedding-sidecar
        image: us-east1-docker.pkg.dev/matech-476914/hik-repo/humaniskind:pyv4.0
        imagePullPolicy: Always
        env:
        - name: OLLAMA_ENDPOINT
          value: http://minillm-server-service:11434
        ports:
        - containerPort: 8000
          name: http
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30   # Model load takes ~10–20s on cold start
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"


