
apiVersion: v1
kind: Service
metadata:
  name: embedding-sidecar-service
  namespace: hik
  labels:
    app: embedding-sidecar
spec:
  type: ClusterIP   # Internal only — called by hik-sidecar, never exposed externally
  selector:
    app: embedding-sidecar
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
