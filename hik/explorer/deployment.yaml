apiVersion: apps/v1
kind: Deployment
metadata:
  name: hik-explorer
  namespace: hik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: explorer
  template:
    metadata:
      labels:
        app: explorer
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            envsubst '$HIK_CONTRACT_ADDRESS' < /usr/share/nginx/html/index.html.template > /usr/share/nginx/html/index.html &&
            nginx -g 'daemon off;'
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html.template
          subPath: index.html.template # Montamos el ConfigMap como un template
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        env:
        - name: HIK_CONTRACT_ADDRESS
          valueFrom:
            secretKeyRef:
              name: hik-wallet-keys # Nombre del Secret que contiene la dirección del contrato
              key: HIK_CONTRACT_ADDRESS # Clave dentro del Secret
      volumes:
      - name: html
        configMap:
          name: hik-explorer-html
          items:
            - key: index.html # El nombre del archivo en el ConfigMap
              path: index.html.template # El nombre del archivo que se montará en el contenedor
      - name: config
        configMap:
          name: hik-explorer-config