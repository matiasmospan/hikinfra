{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hik-core-route
  labels:
    app: hik-sidecar
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }} # Ej: hik-main-gateway
    namespace: {{ .Values.gateway.namespace | default .Release.Namespace }}
  hostnames:
  - {{ .Values.gateway.host | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hik-svc
      port: 8080
{{- end }}