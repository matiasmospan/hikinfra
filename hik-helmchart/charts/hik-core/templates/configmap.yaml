apiVersion: v1
kind: ConfigMap
metadata:
  name: hik-core-config
  labels:
    app: hik-sidecar
data:
  HIK_RPC_URL: {{ .Values.dependencies.besuRpcUrl | quote }}
  HIK_IPFS_CLUSTER_URL: {{ .Values.dependencies.ipfsClusterUrl | quote }}
  HIK_IPFS_KUBO_URL: {{ .Values.dependencies.ipfsKuboUrl | quote }}
  HIK_SLM_ENDPOINT: {{ .Values.dependencies.slmEndpoint | quote }}
  HIK_EMBEDDING_ENDPOINT: {{ .Values.dependencies.embeddingEndpoint | quote }}
  HIK_CHAIN_ID: {{ .Values.config.chainId | quote }}
  HIK_CONTRACT_ADDRESS: {{ .Values.config.contractAddress | quote }}
  HIK_GAS_PRICE: {{ .Values.config.gasPrice | quote }}
  HIK_GAS_LIMIT: {{ .Values.config.gasLimit | quote }}
  HIK_EVM_GAS_LIMIT: {{ .Values.config.evmGasLimit | quote }}
  HIK_ANCHOR_GAS_LIMIT: {{ .Values.config.anchorGasLimit | quote }}
  HIK_L2_TIMEOUT_MS: {{ .Values.config.l2TimeoutMs | quote }}
  HIK_L3_TIMEOUT_MS: {{ .Values.config.l3TimeoutMs | quote }}
  HIK_OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}