# CAPA 2: Nodos de Lectura/RPC (Auto-escalables)
rpcNodes:
  enabled: true
  replicaCount: 1
  image: hyperledger/besu:23.4.0
  autoscaling:
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
storage:
  # Si se deja vacío (""), K8s usará el StorageClass por defecto del clúster (agnóstico)
  className: "premium-rwo"
  size: 50Gi