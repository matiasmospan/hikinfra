apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: hik
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: hik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
        env:
        - name: OPENAI_API_BASE_URL
          value: "https://api.groq.com/openai/v1"
        - name: OPENAI_API_KEY
          value: "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" # 🔑 Saca una en console.groq.com
        - name: WEBUI_SECRET_KEY
          value: "hik-secret-2026-uruguay" # Cambiá esto por algo aleatorio
        - name: OPENWEBUI_ENABLE_API
          value: "true"
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
  namespace: hik
spec:
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  selector:
    app: open-webui